name: Refresh Cam's position
on:
  # Each run loops for about 5.5 hours, then starts the next one itself.
  workflow_dispatch:
  # Backup in case the chain ever stops.
  schedule:
    - cron: '7 */6 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh every 5 minutes, publish to Pages and camerondeanbalser.com/run
        env:
          GH_TOKEN: ${{ github.token }}
          FTP_SERVER: 208.109.49.234
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FORCE_ONCE: '1'
        run: bash build/loop.sh
