name: Send one test heads-up email
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -i --max-time 30 -H 'Origin: https://findcam.meshtc.com' \
            -F name='Test Runner' -F runners=2 -F test=1 \
            -F plan=$'Day: Mon Nov 9 (day 31)\nDistance: about 4 miles\nJoining: mile 2,298, 6 mi from Wabash, IN, around 4:10 pm Eastern\nFinishing: mile 2,302, 4 mi from Wabash, IN, around 5:00 pm Eastern' \
            https://camerondeanbalser.com/run/notify.php | grep -iE '^HTTP|access-control|^\{'
